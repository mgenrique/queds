services:
  api:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: api
    command: python app.py run -h 0.0.0.0
    volumes:
      - ./app/api:/usr/src/
      - ./app/config:/usr/src/config
      - ./app/models:/usr/src/models
      - ./VERSION:/usr/VERSION
    environment:
      - FLASK_ENV=development
      - BACKEND_SETTINGS=config.full
    networks:
      - api_bridge
    restart: always
    depends_on:
      - db
      - redis

  backend:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: backend
    command: python worker.py
    volumes:
      - ./app/backend:/usr/src/
      - ./app/config:/usr/src/config
      - ./app/models:/usr/src/models
    environment:
      - BACKEND_SETTINGS=config.full
      - PYTHON_FILE=worker.py
      - PYTHON_ARGS=""
    networks:
      - api_bridge
    restart: always
    deploy:
      replicas: 1
    depends_on:
      - db
      - redis

  migrate:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: api
    command: bash -c "alembic -c /usr/src/models/migrations/alembic.ini upgrade head"    

    volumes:
      - ./app/config:/usr/src/config
      - ./app/models:/usr/src/models
    environment:
      - BACKEND_SETTINGS=config.full
    networks:
      - api_bridge
    depends_on:
      - db
      - api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_APP_BACKEND_URL=/api
        - VITE_APP_IS_DEMO=false
    command: npm run dev
    volumes:
      - './frontend:/app'
      - frontend_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=development
    networks:
      - api_bridge
    depends_on:
      - db
      - api

  nginx:
    image: nginx
    volumes:
      - ./nginx_template.conf:/etc/nginx/conf.d/default.conf
    restart: always
    ports:
      - 6060:80
    depends_on:
      - backend
      - frontend
    networks:
      - api_bridge

  redis:
    image: bitnami/redis
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    logging:
      driver: none
    networks:
      - api_bridge

  db:
    image: timescale/timescaledb:2.23.1-pg16
    restart: always
    environment:
      POSTGRES_DB: queds
      POSTGRES_USER: queds_user
      POSTGRES_PASSWORD: Kbh85n7M6Fxo
    volumes:
      - users_data:/var/lib/postgresql/data/
    networks:
      - api_bridge
    ports:
      - 15432:5432

  # Development-only services (do NOT replace production services above)
  backend-dev:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: dev
    # Run under debugpy when DEBUG=1 so VS Code can attach (launch.json expects port 5678)
    command: bash -c 'if [ "${DEBUG:-}" = "1" ]; then python -m debugpy --listen 0.0.0.0:5678 --wait-for-client -- python app.py run -h 0.0.0.0; else python app.py run -h 0.0.0.0; fi'
    volumes:
      - ./app/api:/usr/src/
      - ./app/config:/usr/src/config
      - ./app/models:/usr/src/models
      - ./VERSION:/usr/VERSION
    environment:
      - FLASK_ENV=development
      - BACKEND_SETTINGS=config.full
      - PORT=8000
      - DEBUG=1
    ports:
      - 8000:8000
      - 5678:5678
    networks:
      - api_bridge
    restart: always
    depends_on:
      - db
      - redis

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_APP_BACKEND_URL=/api
        - VITE_APP_IS_DEMO=false
    command: npm run dev -- --host --port 5173
    ports:
      - 5173:5173
    volumes:
      - './frontend:/app'
      - frontend_node_modules:/app/node_modules
      - ./frontend/.env.development:/app/.env.development
    environment:
      - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=development
    networks:
      - api_bridge
    depends_on:
      - api

  devcontainer:
    build:
      context: ./.devcontainer
      dockerfile: Dockerfile
    volumes:
      - ./:/workspaces/queds:cached
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    networks:
      - api_bridge
    depends_on:
      - db
      - redis
      - backend-dev
      - frontend-dev
    tty: true

  # One-shot seeder service (idempotent)
  seed:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: api
    command: bash -c "PYTHONPATH=/usr/src python /usr/src/scripts/seed_demo.py"
    volumes:
      - ./app/api:/usr/src/
      - ./app/config:/usr/src/config
      - ./app/models:/usr/src/models
      - ./app/scripts:/usr/src/scripts
    environment:
      - BACKEND_SETTINGS=config.full
    networks:
      - api_bridge
    depends_on:
      - db
    restart: "no"

networks:
  api_bridge:
    driver: bridge

volumes:
  users_data:
  frontend_node_modules:
